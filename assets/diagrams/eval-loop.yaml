# 평가 루프: 정답 데이터 대비 측정 → 실패 분석 → 스키마·프롬프트·규칙 개선 → 다시 측정
# 생성: python ../../../_design/excalidraw_kit.py eval-loop.yaml --out . --export
name: eval-loop
title: 평가 루프 — 측정하고 고치고 다시 측정
subtitle: 정확도보다 먼저 "놓친 결함"과 "조용한 오류"를 본다
layout: cycle
maxTextWidth: 220
gapX: 90
nodes:
  - {id: gold, label: "정답 데이터\n가상 문서 30건 + 정답\n어려운 케이스 50%", role: neutral}
  - {id: run, label: "파이프라인 실행\nmock · gemini\n· claude · openai", role: accent}
  - {id: measure, label: "측정\n필드 정확도 · 완전 일치\n확인 비율 · 처리 시간", role: primary}
  - {id: analyze, label: "실패 분석\n놓친 결함 · 조용한 오류\n불필요한 확인", role: warning}
  - {id: improve, label: "개선\n스키마 · 프롬프트\n· 검증 규칙", role: primary}
edges:
  - {from: gold, to: run}
  - {from: run, to: measure}
  - {from: measure, to: analyze}
  - {from: analyze, to: improve}
  - {from: improve, to: gold, label: 케이스 추가, role: primary, style: dashed}
notes:
  - {id: center, text: "eval/report.md", at: center, fontSize: 20}
