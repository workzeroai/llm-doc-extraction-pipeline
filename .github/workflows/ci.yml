name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 한글 글꼴 (가상 PDF 생성용)
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-nanum

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm]"

      - name: 린트 (ruff)
        run: ruff check .

      - name: 테스트 (pytest, 키 없이 · n8n Code 노드 포함)
        run: pytest -q

      - name: 오프라인 데모 → 평가 리포트 (모의 추출기)
        run: |
          python -m pipeline.run --offline --simulate-provider-errors --report ci-report.md
          docpipe demo --workdir .ci-demo
          head -n 30 ci-report.md
          cat ci-report.md >> "$GITHUB_STEP_SUMMARY"   # 평가 리포트를 작업 요약에 표시(모의 추출기 기준)

      - name: n8n 워크플로 최신 여부
        run: python scripts/build_n8n.py --check
